syntax = "proto3";

package kvstore;

// =========================
// Servidor de pares
// =========================

message InsertRequest {
  int32 key = 1;
  string value = 2;
}

message InsertReply {
  int32 status = 1;
}

message QueryRequest {
  int32 key = 1;
}

message QueryReply {
  string value = 1;
}

message ActivateRequest {}

message ActivateReply {
  int32 status = 1;
}

message TerminateRequest {}

message TerminateReply {
  int32 num_keys = 1;
}

service KeyValueStore {
  rpc Insert(InsertRequest) returns (InsertReply);
  rpc Query(QueryRequest) returns (QueryReply);
  rpc Activate(ActivateRequest) returns (ActivateReply);
  rpc Terminate(TerminateRequest) returns (TerminateReply);
}



// =========================
// Servidor concentrador
// =========================

message RegisterRequest {
  string locator = 1;
  repeated int32 keys = 2;
}

message RegisterReply {
  int32 count = 1;
}

message LookupRequest {
  int32 key = 1;
}

message LookupReply {
  string locator = 1;
}

message PairingRequest {
  string locator = 1;
}

message PairingReply {
  int32 status = 1;
}

message DirectoryTerminateReply {
  int32 total_keys = 1;
}

service DirectoryService {
  rpc Register(RegisterRequest) returns (RegisterReply);
  rpc Lookup(LookupRequest) returns (LookupReply);
  rpc Pairing(PairingRequest) returns (PairingReply);
  rpc Terminate(TerminateRequest) returns (DirectoryTerminateReply);
}
